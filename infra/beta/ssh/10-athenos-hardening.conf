# /etc/ssh/sshd_config.d/10-athenos-hardening.conf
# Keys only, no root login, only the admin account. install.sh refuses to
# install this file while the admin has no authorized key.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
# install.sh replaces ADMIN_USER with the admin account name.
AllowUsers ADMIN_USER
