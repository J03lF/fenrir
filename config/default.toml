app = { name = "fenrir", version = "0.1.3" }

[server]
enable_http = false
enable_grpc = false

[server.ssh]
host = "127.0.0.1"
port = 2222
user = "test"
server_name = "fenrir-Test"
host_key_path = "keys/server/ssh/host_ed25519"
idle_close_seconds = 30

[server.http]
host = "127.0.0.1"
port = 8080

[security]
allowed_ciphers = ["AES-GCM", "XChaCha20-Poly1305"]

[security.kdf]
algorithm = "argon2id"

[security.jwt]
issuer = "fenrir"
audience = "fenrir-clients"
exp_seconds = 3600

[db]
default_engine = "postgres"

[db.connections.postgres]
uri = "env:FENRIR_DB_POSTGRES_URI"

[db.connections.postgres.pool]
max = 16
timeout_ms = 5000

[telemetry]
tracing_level = "info"
metrics_enabled = false
health_enabled = true

[audit]
enabled = true

[cli]
prompt_theme = "default"
