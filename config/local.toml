[server.ssh]
idle_close_seconds = 99999

# Dev-friendly session timeouts (default: 3600/900 is too short for development)
[security.session]
lifetime_seconds = 86400      # 24h
idle_timeout_seconds = 14400  # 4h

[security.identity]
provider = "embedded"
environment = "development"

# Password policy for first-time setup (relaxed for local dev)
[security.password_policy]
min_length = 4
max_length = 128
require_uppercase = false
require_lowercase = false
require_digit = false
require_special = false
check_common_passwords = false

[security.identity.embedded]
storage = "db"
store_path = "/opt/fenrir/development/tmp/identity/store.json"

[security.service_tokens]
idle_timeout_seconds = 850
cleanup_interval_seconds = 50

[db.runtime.embedded.sqlite]
file_path = "/opt/fenrir/development/tmp/runtime/db/fenrir.db"

[db.runtime.embedded.postgres]
data_dir = "runtime/db/postgres"
binary_path = "/opt/homebrew/opt/postgresql@16/bin/postgres"

[audit.storage]
path = "/opt/fenrir/development/tmp/runtime/audit/fenrir-audit-history.json"
retention_days = 1
