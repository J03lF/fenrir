[package]
name = "fenrir"
version = "0.1.4"
edition = "2021"

# Workspace removed - modules are now managed externally

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "macros"] }
whoami = "1.5"
thrussh = "=0.32.10"
thrussh-keys = "=0.20.6"
futures = "0.3"
async-trait = "0.1"
rustyline = "12"
uuid = { version = "1.8", features = ["v4"] }
axum = { version = "0.7", features = ["macros"] }
subtle = "2.5"
arc-swap = "1.6"
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1.7", features = ["http1", "http2", "server"] }
tokio-stream = { version = "0.1", features = ["sync"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
notify = { version = "6", default-features = true }
semver = { version = "1.0", features = ["serde"] }
base64 = "0.21"
hex = "0.4"
ed25519-dalek = { version = "1.0", features = ["std"] }
sha2 = "0.10"
toml = "0.8.23"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"
flate2 = { version = "1.0", default-features = true }
tar = "0.4"
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash"] }
password-hash = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10", features = ["aes"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }
rand = { version = "0.8", features = ["std"] }
rand_core = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "process"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.metadata]
description = "Fenrir: modular Rust monolith for a secure ticketing system"
