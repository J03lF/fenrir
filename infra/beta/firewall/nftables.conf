#!/usr/sbin/nft -f
# Alternative to ufw.sh (use one of them, not both): /etc/nftables.conf,
# then `systemctl enable --now nftables`. Same policy: inbound only
# 22/tcp (rate-limited), 80/tcp, 443/tcp, 443/udp; everything else dropped.

flush ruleset

table inet filter {
	set ssh_meter4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 1m
	}
	set ssh_meter6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 1m
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept

		# ICMP is needed (path MTU, IPv6 neighbour discovery).
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# SSH: more than 6 new connections per minute from one source = drop.
		tcp dport 22 ct state new update @ssh_meter4 { ip saddr limit rate over 6/minute burst 3 packets } drop
		tcp dport 22 ct state new update @ssh_meter6 { ip6 saddr limit rate over 6/minute burst 3 packets } drop
		tcp dport 22 ct state new accept

		tcp dport { 80, 443 } accept
		udp dport 443 accept

		limit rate 5/minute log prefix "nft drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
