# /etc/postgresql/16/main/conf.d/athenos.conf - PostgreSQL 16 for the
# Athenos beta (8 GB RAM server, Postgres next to the host and the AI model).

# Unix socket only: no TCP listener at all. The host and the backup connect
# through /var/run/postgresql with peer authentication (pg_hba.conf).
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
max_connections = 60
password_encryption = scram-sha-256

# Memory (about 1/8 of RAM for shared buffers; the host and the model need
# the rest).
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Durability stays on (never fsync=off / synchronous_commit=off).
wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 2GB

# Logs: no statement texts with data in them; errors only, plus slow
# queries without parameters. The file is rotated by logrotate (7 days).
log_min_messages = warning
log_min_error_statement = panic
log_min_duration_statement = 2000
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# Long-running idle transactions would block vacuum and migrations.
idle_in_transaction_session_timeout = 10min
