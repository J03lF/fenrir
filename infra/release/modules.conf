# Modul-Tabelle für release.sh (siehe README.md).
#
# Die Reihenfolge der module-Zeilen ist die Push-Reihenfolge: was andere
# Repos pinnen, kommt zuerst (contracts → notification-service → auth-service
# → athenos → athenos-api → athenos-web, webcomponents, fenrir).
#
#   root <verzeichnis>     Basis für relative Pfade (RELEASE_ROOT überschreibt)
#   module <name> <pfad> <branch> <writer> <plattform> <gates ...>
#     writer    wo die Version steht, durch Kommas getrennt:
#               cargo (Cargo.toml [package] + Cargo.lock), fenrir-dev
#               (.fenrir-dev.toml [module]), openapi=<json>, npm (package.json
#               + package-lock.json), npm=<package.json>, ts-const=<ts-datei>
#               (VERSION: '…'), - (nur Tag)
#     plattform des Release-Bündels (linux-x86_64, any) oder - (kein Bündel);
#               Module mit Plattform kommen in die `depot import github`-Zeile
#     gates     schnelle lokale Tore, als Shell-Befehl im Repo (Rest der Zeile),
#               - für keine
#   sibling <name> <pfad>  Repo, das nur gepinnt wird (für die Pin-Warnung)
#   pin <VARIABLE> <repo>  ein SHA-Pin in .github/workflows/release.yml; Git-Pins
#               in package.json (github.com/<owner>/<repo>.git#<sha>) erkennt
#               release.sh selbst

root /opt/fenrir/development

#      name                  pfad                           branch  writer                                                                                    plattform     gates
module athenos-contracts     athenos-contracts              main    -                                                                                         -             scripts/ci-local.sh fmt clippy
module notification-service  modules/notification-service   0.1.0   cargo,fenrir-dev                                                                          linux-x86_64  scripts/ci-local.sh fmt clippy
module auth-service          modules/auth-service           0.1.0   cargo,fenrir-dev                                                                          linux-x86_64  scripts/ci-local.sh fmt clippy
module athenos               modules/athenos                0.1.0   cargo,fenrir-dev                                                                          linux-x86_64  scripts/ci-local.sh fmt clippy
module athenos-api           modules/athenos-api            0.1.0   cargo,fenrir-dev,openapi=openapi/athenos-api.json                                         linux-x86_64  scripts/ci-local.sh fmt clippy
module athenos-web           modules/athenos-web            0.1.0   npm,ts-const=src/app/data/constants/app.constants.ts                                      any           npm run lint
module athenos-webcomponents modules/athenos-webcomponents  0.1.0   npm,npm=projects/athenos-webcomponents/package.json,npm=dist/athenos-webcomponents/package.json -   npm run lint
module fenrir                fenrir                         master  cargo                                                                                     linux-x86_64  cargo fmt --all -- --check && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

sibling module-kit           module-kit
sibling fenrir-depot         fenrir-depot

pin MODULE_KIT_SHA module-kit
pin CONTRACTS_SHA  athenos-contracts
pin ATHENOS_SHA    athenos
pin DEPOT_SHA      fenrir-depot
