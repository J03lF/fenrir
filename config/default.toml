app = { name = "fenrir", version = "0.13.0-1" }

# Runtime paths configuration
# All paths are relative to base_path unless absolute
# FENRIR_RUNTIME_DIR env var overrides base_path
[runtime]
base_path = "runtime"           # Base directory for all runtime data
identity_dir = "identity"       # Identity store location
db_dir = "db"                   # Embedded database files
migrations_dir = "migrations"   # Migration state files
ipc_dir = "ipc"                 # IPC sockets
scheduler_dir = "scheduler"     # Scheduler state

[server]
enable_http = true
enable_grpc = true

[server.ssh]
host = "127.0.0.1"
port = 2222
user = "test"
server_name = "fenrir-Test"
host_key_path = "keys/server/ssh/host_ed25519"


[server.ssh.tls]
allowed_ciphers = []

[server.http]
host = "127.0.0.1"
port = 8080

# Real client address behind a reverse proxy (W9A-01). Off by default: every
# client is its TCP peer. With both keys set, the static-site edge and the
# control-plane gateway believe `client_ip_header` only from a TCP peer in
# `trusted_proxies`, and only when it holds exactly one IP address; otherwise
# the peer is the client. Client-sent address headers (X-Forwarded-For,
# X-Real-IP, Forwarded, CF-Connecting-IP, True-Client-IP and the configured
# one) are always stripped; modules receive `X-Forwarded-For: <client>`.
# Invalid CIDRs or a header without trusted proxies stop the host at startup.
# Env: FENRIR_SERVER__EDGE__CLIENT_IP_HEADER=x-real-ip
#      FENRIR_SERVER__EDGE__TRUSTED_PROXIES=127.0.0.1/32,::1/128
[server.edge]
# client_ip_header = "x-real-ip"
# trusted_proxies = ["127.0.0.1/32", "::1/128"]

[server.http.tls]
enabled = false
cert_path = "config/certs/server.crt"
key_path = "config/certs/server.key"
cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256"]

[server.grpc]
host = "127.0.0.1"
port = 50051

[server.grpc.tls]
enabled = false
cert_path = "config/certs/server-grpc.crt"
key_path = "config/certs/server-grpc.key"
cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256"]

[security]
allowed_ciphers = ["AES-GCM", "XChaCha20-Poly1305"]

[security.kdf]
algorithm = "argon2id"
version = 1

[security.jwt]
issuer = "fenrir"
audience = "fenrir-clients"
exp_seconds = 3600

[security.http]
control_tokens = [
    "admin:env:FENRIR_HTTP_TOKEN_ADMIN",
    "operator:env:FENRIR_HTTP_TOKEN_OPERATOR",
    "viewer:env:FENRIR_HTTP_TOKEN_VIEWER",
]

[security.identity]
provider = "external"
environment = "development"
instance_id = "local"

[security.identity.embedded]
store_path = "identity/store.json"
audience = "fenrir-control-plane"

[security.identity.external]
base_url = "http://127.0.0.1:8081"
jwks_url = "http://127.0.0.1:8081/jwks.json"
auth_token = "env:FENRIR_IDENTITY_TOKEN"
jwks_refresh_seconds = 300
audience = "fenrir-control-plane"

# Password policy for first-time setup (strict defaults for production)
[security.password_policy]
min_length = 12
max_length = 128
require_uppercase = true
require_lowercase = true
require_digit = true
require_special = false
check_common_passwords = true

[security.session]
lifetime_seconds = 3600
idle_timeout_seconds = 900
cleanup_interval_seconds = 300

[security.service_tokens]
lifetime_seconds = 900
idle_timeout_seconds = 300
cleanup_interval_seconds = 60
refresh_grace_seconds = 3600

[db]
default_engine = "postgres"

[db.runtime]
mode = "embedded" # external | embedded

[db.backup]
enabled = true
schedule = "daily"          # hourly | daily | weekly
retention_count = 7         # Anzahl Backups behalten
path = "backups"            # Backup-Verzeichnis
pg_basebackup_path = "/opt/homebrew/Cellar/postgresql@16/16.11/bin/pg_basebackup"
min_disk_space_mb = 500     # Min. freier Speicher
require_healthy = true      # DB muss healthy sein
verify_integrity = true     # Checksum prüfen

[db.runtime.embedded]
engine = "postgres" # sqlite | postgres

[db.runtime.embedded.sqlite]
file_path = "runtime/db/fenrir.db"
# vacuum_interval_seconds = 0

[db.runtime.embedded.postgres]
data_dir = "/opt/fenrir/tmp/runtime/db/postgres"
binary_path = "postgres"

[db.runtime.embedded.postgres.port_range]
min = 55432
max = 55442

# Security settings for embedded database
[db.runtime.embedded.security]
auth_method = "scram-sha-256"  # "trust" (legacy) or "scram-sha-256" (secure)
prefer_unix_socket = true       # Use Unix socket instead of TCP (more secure)
credential_rotation_hours = 0   # 0 = disabled, 24 = daily rotation

[db.connections.postgres]
uri = "env:FENRIR_DB_POSTGRES_URI"

[db.connections.postgres.pool]
max = 16
timeout_ms = 5000

[db.schema]
export_dir = "/opt/fenrir/development/tmp/schemas"
import_dir = "/opt/fenrir/development/tmp/schemas"
auto_backup = true  # Vor Import automatisch Backup machen

[telemetry.tracing]
level = "info"

[telemetry.metrics]
enabled = true

[telemetry.health]
enabled = true

[telemetry.system]
enabled = true
interval_ms = 5000

# Log rotation and retention (W9A-13, C18): the host's app.log/db.log and
# every module log rotate daily (UTC) or at max_file_mb, archives go to
# <log dir>/archive/<name>-<timestamp>.log and are deleted after
# retention_days (at most max_archives per log). Files are 0600. Module logs
# are checked every check_interval_seconds and rotated by copy + truncate
# (a module keeps its descriptor); a restarting module's previous log is
# archived instead of truncated.
[telemetry.logs]
retention_days = 7
max_file_mb = 50
max_archives = 30
check_interval_seconds = 60

[telemetry.history]
retention_days = 1
persist_interval_seconds = 120
sample_interval_seconds = 30

[audit]
enabled = true
buffer_capacity = 2048

[audit.storage]
path = "runtime/audit/fenrir-audit-history.json"
retention_days = 2
persist_interval_seconds = 30

[cli]
prompt_theme = "default"

#[modules]
#bootstrap = ["fenrir-api"]

[modules.registry]
url = "http://localhost:8443"
allow_offline = false
offline_dirs = []
auth_token = "env:FENRIR_REGISTRY_TOKEN"

[modules.registry.tls]
# ca_cert_path = "config/certs/registry-ca.pem"
# client_cert_path = "config/certs/fenrir-client.crt"
# client_key_path = "config/certs/fenrir-client.key"
accept_invalid_certs = false

[modules.runtime]
# stub = expiremtel (fake engine)
engine = "process"
default_service_scopes = ["db:read"]
# Optional global passthrough prefixes for module env injection.
# Fenrir also derives module-local prefixes automatically (e.g. `ATHENOS_`, `AUTH_`).
env_passthrough_prefixes = []

[modules.runtime.ports]
strategy = "dynamic"

[modules.runtime.ports.range]
min = 41000
max = 46000

[modules.runtime.clients]
timeout_ms = 10000
retries = 2
backoff_ms = 200
health_probe_interval_seconds = 30

[modules.runtime.rollout]
watch_config = true
watch_debounce_ms = 750
restart_on_override_change = true
drain_before_restart_ms = 750
inter_restart_delay_ms = 250
health_check_timeout_ms = 15000
health_poll_interval_ms = 500
rollback_on_failure = true
abort_on_first_failure = true

[modules.runtime.rollout.replacement]
enabled = true
default_strategy = "rolling_replace"
default_max_surge = 1
default_max_unavailable = 0
default_warmup_timeout_ms = 30000
default_promotion_interval_ms = 30000

[modules.runtime.clients.tls]
# ca_cert_path = "config/certs/control-plane-ca.pem"
# client_cert_path = "config/certs/control-plane-client.crt"
# client_key_path = "config/certs/control-plane-client.key"
accept_invalid_certs = false

[modules.services]
[modules.service_profiles.control_plane_standard.env]
FENRIR_CONTROL_PLANE_TIMEOUT_MS = "2500"
FENRIR_CONTROL_PLANE_CONNECT_TIMEOUT_MS = "1000"
FENRIR_CONTROL_PLANE_RETRY_ATTEMPTS = "2"
FENRIR_CONTROL_PLANE_RETRY_BACKOFF_MS = "200"
FENRIR_CONTROL_PLANE_POOL_IDLE_TIMEOUT_MS = "90000"
FENRIR_CONTROL_PLANE_POOL_MAX_IDLE_PER_HOST = "32"

[modules.service_profiles.notification_delivery_standard.env]
ATHENOS_NOTIFICATION_DELIVERY_CONCURRENCY = "4"
ATHENOS_NOTIFICATION_QUEUE_CAPACITY = "512"
ATHENOS_NOTIFICATION_DELIVERY_RETRIES = "3"
ATHENOS_NOTIFICATION_DELIVERY_RETRY_BACKOFF_MS = "500"

[modules.service_profiles.notification_worker_standard.env]
ATHENOS_NOTIFICATION_DELIVERY_CONCURRENCY = "8"
ATHENOS_NOTIFICATION_QUEUE_BATCH_SIZE = "32"
ATHENOS_NOTIFICATION_QUEUE_POLL_INTERVAL_SECONDS = "5"

[modules.services."module:athenos-api"]
profile = "control_plane_standard"
