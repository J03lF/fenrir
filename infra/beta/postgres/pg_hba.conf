# /etc/postgresql/16/main/pg_hba.conf - Athenos beta. Socket only, peer
# authentication: the OS user name must equal the role name. No TCP lines at
# all (listen_addresses = '' anyway), no passwords anywhere.
#
# TYPE  DATABASE        USER            METHOD
local   all             postgres        peer
# athenos owns the database athenos (and restore drill copies athenos_restore_*)
local   all             athenos         peer
local   all             all             reject
