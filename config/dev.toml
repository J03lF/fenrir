[server]
enable_http = true
enable_grpc = true

[server.ssh.tls]
host_key_reload_seconds = 600

[server.http.tls]
reload_interval_seconds = 300

[security.identity]
provider = "embedded"
environment = "dev"

# Password policy for first-time setup (relaxed for dev)
[security.password_policy]
min_length = 4
max_length = 125
require_uppercase = false
require_lowercase = false
require_digit = false
require_special = false
check_common_passwords = false

[security.identity.embedded]
store_path = "identity/store-dev.json"

[telemetry.metrics]
enabled = true

[audit]
enabled = true
buffer_capacity = 2048