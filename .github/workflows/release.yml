# Linux release bundle of the Fenrir host for the Athenos beta server
# (infra/beta/RUNBOOK.md). Packaging runs only after the quality gates of
# ci.yml. A tag v* publishes fenrir-<version>-x86_64-unknown-linux-gnu.tar.gz
# and SHA256SUMS to the GitHub release of that tag (infra/beta/deploy.sh
# downloads them); a manual run only keeps them as workflow artifacts.
#
# Reproducible: pinned toolchain, --locked, no build cache, CARGO_INCREMENTAL=0,
# SOURCE_DATE_EPOCH = commit time, --remap-path-prefix for every local path,
# module-kit and the toolchain pinned by ci.yml (read from it, one place),
# tarball with sorted entries, fixed mtime and owner (infra/beta/ci/package-host.sh).
#
# Replaces the former "Promote" placeholder, which shipped bin/.fenrir-profile
# (developer settings) inside the bundle.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  bundle:
    name: Linux bundle (x86_64)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # gh release upload, tags only
    defaults:
      run:
        working-directory: fenrir
    steps:
      # Same layout as ci.yml: fenrir/ and the path-patched ../module-kit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fenrir
          persist-credentials: false
      - name: Pins from ci.yml
        id: pins
        run: |
          pin() { sed -n "s/^  $1: *\"\{0,1\}\([^\" #]*\)\"\{0,1\}.*/\1/p" .github/workflows/ci.yml | head -n 1; }
          kit=$(pin MODULE_KIT_SHA); toolchain=$(pin RUST_TOOLCHAIN)
          [[ $kit =~ ^[0-9a-f]{40}$ ]] && [[ $toolchain =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::could not read MODULE_KIT_SHA, RUST_TOOLCHAIN from ci.yml"; exit 1; }
          echo "module_kit=$kit" >> "$GITHUB_OUTPUT"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: J03lF/module-kit
          ref: ${{ steps.pins.outputs.module_kit }}
          path: module-kit
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          persist-credentials: false
      - name: Install Rust ${{ steps.pins.outputs.toolchain }}
        env:
          TOOLCHAIN: ${{ steps.pins.outputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET_TRIPLE"
          rustup default "$TOOLCHAIN"
      - name: Version
        id: version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="${crate_version}+g$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sde=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "fenrir $version (crate $crate_version)"
      - name: Build (locked, reproducible)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.sde }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          cargo build --release --locked --target "$TARGET_TRIPLE" --bins
      - name: Package
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.sde }}
        run: |
          bash infra/beta/ci/package-host.sh "target/$TARGET_TRIPLE/release" "${{ steps.version.outputs.version }}" dist
          echo "Shared libraries the host needs on the server:"
          readelf -d "target/$TARGET_TRIPLE/release/fenrir" | grep NEEDED || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fenrir-${{ steps.version.outputs.version }}-${{ env.TARGET_TRIPLE }}
          path: |
            fenrir/dist/*.tar.gz
            fenrir/dist/SHA256SUMS
          retention-days: 30
      - name: Publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "fenrir $TAG" \
              --notes "Linux bundle of the Fenrir host for the Athenos beta server. Verify with: sha256sum -c SHA256SUMS"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz dist/SHA256SUMS
      - name: Summary
        run: |
          {
            echo "## fenrir ${{ steps.version.outputs.version }}"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
