#!/usr/sbin/nft -f
# Alternative to ufw.sh (use one of them, not both): /etc/nftables.conf,
# then `systemctl enable --now nftables`. Same policy: inbound 22/tcp
# (rate-limited, key-only sshd) and 443/tcp from Cloudflare only; everything
# else dropped. The Cloudflare sets come from server/cloudflare-ips.sh
# (it rewrites the include file and reloads nftables).

include "/etc/athenos/cloudflare-ips.nft"

flush ruleset

table inet filter {
	set ssh_meter4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 1m
	}
	set ssh_meter6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 1m
	}
	set cloudflare4 {
		type ipv4_addr
		flags interval
		elements = $CLOUDFLARE_V4
	}
	set cloudflare6 {
		type ipv6_addr
		flags interval
		elements = $CLOUDFLARE_V6
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept

		# ICMP is needed (path MTU, IPv6 neighbour discovery).
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# SSH: more than 6 new connections per minute from one source = drop.
		# To restrict the source, add e.g. `ip saddr 203.0.113.7` before accept.
		tcp dport 22 ct state new update @ssh_meter4 { ip saddr limit rate over 6/minute burst 3 packets } drop
		tcp dport 22 ct state new update @ssh_meter6 { ip6 saddr limit rate over 6/minute burst 3 packets } drop
		tcp dport 22 ct state new accept

		# HTTPS only from Cloudflare (proxy in front of app.athenos.dev).
		tcp dport 443 ip saddr @cloudflare4 accept
		tcp dport 443 ip6 saddr @cloudflare6 accept

		limit rate 5/minute log prefix "nft drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
