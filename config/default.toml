app = { name = "fenrir", version = "0.1.4" }

# Runtime paths configuration
# All paths are relative to base_path unless absolute
# FENRIR_RUNTIME_DIR env var overrides base_path
[runtime]
base_path = "runtime"           # Base directory for all runtime data
identity_dir = "identity"       # Identity store location
db_dir = "db"                   # Embedded database files
migrations_dir = "migrations"   # Migration state files
ipc_dir = "ipc"                 # IPC sockets
scheduler_dir = "scheduler"     # Scheduler state

[server]
enable_http = true
enable_grpc = true

[server.ssh]
host = "127.0.0.1"
port = 2222
user = "test"
server_name = "fenrir-Test"
host_key_path = "keys/server/ssh/host_ed25519"
idle_close_seconds = 300

[server.ssh.tls]
allowed_ciphers = []

[server.http]
host = "127.0.0.1"
port = 8080

[server.http.tls]
enabled = false
cert_path = "config/certs/server.crt"
key_path = "config/certs/server.key"
cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256"]

[server.grpc]
host = "127.0.0.1"
port = 50051

[server.grpc.tls]
enabled = false
cert_path = "config/certs/server-grpc.crt"
key_path = "config/certs/server-grpc.key"
cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256"]

[security]
allowed_ciphers = ["AES-GCM", "XChaCha20-Poly1305"]

[security.kdf]
algorithm = "argon2id"
version = 1

[security.jwt]
issuer = "fenrir"
audience = "fenrir-clients"
exp_seconds = 3600

[security.http]
control_tokens = [
    "admin:env:FENRIR_HTTP_TOKEN_ADMIN",
    "operator:env:FENRIR_HTTP_TOKEN_OPERATOR",
    "viewer:env:FENRIR_HTTP_TOKEN_VIEWER",
]

[security.identity]
provider = "external"
environment = "development"
instance_id = "local"

[security.identity.embedded]
store_path = "identity/store.json"
audience = "fenrir-control-plane"

[security.identity.external]
base_url = "http://127.0.0.1:8081"
jwks_url = "http://127.0.0.1:8081/jwks.json"
auth_token = "env:FENRIR_IDENTITY_TOKEN"
jwks_refresh_seconds = 300
audience = "fenrir-control-plane"

# Password policy for first-time setup (strict defaults for production)
[security.password_policy]
min_length = 12
max_length = 128
require_uppercase = true
require_lowercase = true
require_digit = true
require_special = false
check_common_passwords = true

[security.session]
lifetime_seconds = 3600
idle_timeout_seconds = 900
cleanup_interval_seconds = 300

[security.service_tokens]
lifetime_seconds = 900
idle_timeout_seconds = 300
cleanup_interval_seconds = 60

[db]
default_engine = "postgres"

[db.runtime]
mode = "embedded" # external | embedded

[db.backup]
enabled = true
schedule = "daily"          # hourly | daily | weekly
retention_count = 7         # Anzahl Backups behalten
path = "backups"            # Backup-Verzeichnis
pg_basebackup_path = "/opt/homebrew/Cellar/postgresql@16/16.11/bin/pg_basebackup"
min_disk_space_mb = 500     # Min. freier Speicher
require_healthy = true      # DB muss healthy sein
verify_integrity = true     # Checksum prüfen

[db.runtime.embedded]
engine = "postgres" # sqlite | postgres

[db.runtime.embedded.sqlite]
file_path = "runtime/db/fenrir.db"
# vacuum_interval_seconds = 0

[db.runtime.embedded.postgres]
data_dir = "/opt/fenrir/tmp/runtime/db/postgres"
binary_path = "postgres"

[db.runtime.embedded.postgres.port_range]
min = 55432
max = 55442

# Security settings for embedded database
[db.runtime.embedded.security]
auth_method = "scram-sha-256"  # "trust" (legacy) or "scram-sha-256" (secure)
prefer_unix_socket = true       # Use Unix socket instead of TCP (more secure)
credential_rotation_hours = 0   # 0 = disabled, 24 = daily rotation

[db.connections.postgres]
uri = "env:FENRIR_DB_POSTGRES_URI"

[db.connections.postgres.pool]
max = 16
timeout_ms = 5000

[db.schema]
export_dir = "/opt/fenrir/development/tmp/schemas"
import_dir = "/opt/fenrir/development/tmp/schemas"
auto_backup = true  # Vor Import automatisch Backup machen

[telemetry.tracing]
level = "info"

[telemetry.metrics]
enabled = true

[telemetry.health]
enabled = true

[telemetry.system]
enabled = true
interval_ms = 5000

[telemetry.history]
retention_days = 1
persist_interval_seconds = 120
sample_interval_seconds = 30

[audit]
enabled = true
buffer_capacity = 2048

[audit.storage]
path = "runtime/audit/fenrir-audit-history.json"
retention_days = 2
persist_interval_seconds = 30

[cli]
prompt_theme = "default"

#[modules]
#bootstrap = ["fenrir-api"]

[modules.registry]
url = "http://localhost:8443"
allow_offline = false
offline_dirs = []
auth_token = "env:FENRIR_REGISTRY_TOKEN"

[modules.registry.tls]
# ca_cert_path = "config/certs/registry-ca.pem"
# client_cert_path = "config/certs/fenrir-client.crt"
# client_key_path = "config/certs/fenrir-client.key"
accept_invalid_certs = false

[modules.runtime]
# stub = expiremtel (fake engine)
engine = "process"
default_service_scopes = ["db:read"]

[modules.runtime.ports]
strategy = "dynamic"

[modules.runtime.ports.range]
min = 41000
max = 46000

[modules.runtime.clients]
timeout_ms = 10000
retries = 2
backoff_ms = 200
health_probe_interval_seconds = 30

[modules.runtime.clients.tls]
# ca_cert_path = "config/certs/control-plane-ca.pem"
# client_cert_path = "config/certs/control-plane-client.crt"
# client_key_path = "config/certs/control-plane-client.key"
accept_invalid_certs = false

[modules.services]
# Example service overrides:
# [modules.services."module:fenrir-api".env]
# PUBLIC_URL = "https://tickets.local"
# [modules.services."module:fenrir-api".secrets]
# API_KEY = "env:FENRIR_API_KEY"
# [modules.services."module:fenrir-api".policy]
# internal_only = false
# allowed_roles = ["service-read", "service-write"]
# required_scopes = ["tickets:read"]
# [modules.services."module:fenrir-api".policy.tenant]
# mode = "fixed"
# value = "default"

[modules.storage]
install_dir = "/Users/jfurocket/Documents/personal/modules"
cache_dir = "/Users/jfurocket/Documents/personal/modules/.cache"

[modules.dev_sources]
base_path = "/opt/fenrir/development/modules/"

[modules.trust]
require_signature = false
allowed_signers = ["module-registry"]
keyring_path = "config/modules/keyring.json"
