app = { name = "fenrir", version = "0.1.3" }

[server]
enable_http = false
enable_grpc = false

[server.ssh]
host = "127.0.0.1"
port = 2222
user = "test"
server_name = "fenrir-Test"
host_key_path = "keys/server/ssh/host_ed25519"
idle_close_seconds = 30

[server.ssh.tls]
allowed_ciphers = []
host_key_reload_seconds = 600

[server.http]
host = "127.0.0.1"
port = 8080

[server.http.tls]
enabled = false
cert_path = "config/certs/server.crt"
key_path = "config/certs/server.key"
cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256"]
reload_interval_seconds = 300

[security]
allowed_ciphers = ["AES-GCM", "XChaCha20-Poly1305"]

[security.kdf]
algorithm = "argon2id"
version = 1

[security.jwt]
issuer = "fenrir"
audience = "fenrir-clients"
exp_seconds = 3600

[security.http]
control_tokens = []

[security.identity]
provider = "embedded"
environment = "dev"
instance_id = "local"

[security.identity.embedded]
store_path = "runtime/identity/store-dev.json"
audience = "fenrir-control-plane"

[security.identity.external]
base_url = "https://identity.example.com"
jwks_url = "https://identity.example.com/jwks.json"
auth_token = "env:FENRIR_IDENTITY_TOKEN"
jwks_refresh_seconds = 300
audience = "fenrir-control-plane"

[db]
default_engine = "postgres"

[db.connections.postgres]
uri = "env:FENRIR_DB_POSTGRES_URI"

[db.connections.postgres.pool]
max = 16
timeout_ms = 5000


[telemetry.tracing]
level = "error"

[telemetry.metrics]
enabled = false

[telemetry.health]
enabled = true

[telemetry.system]
enabled = true
interval_ms = 5000

[audit]
enabled = true

[audit.storage]
path = "runtime/audit/fenrir-audit-history.json"
retention_hours = 24
persist_interval_seconds = 30

[cli]
prompt_theme = "default"
